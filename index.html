<body>
<div class="app-container">

<!-- 學生預約 iframe -->

    <button class="close-iframe" id="closeIframeBtn">✖ 關閉</button>
    <iframe id="bookingIframe" src=""></iframe>
</div>

<script>
// ========== OAuth 設定 ==========
const CLIENT_ID = '448045465424-2m36ohn34hfq8c7hrriub3fforfub0o5.apps.googleusercontent.com';
const SPREADSHEET_ID = '1qqtTlgJoLdaDkNQVfzjyyEBbyvmcYB_3IQHRUnCPRMU';
const SCOPES = 'https://www.googleapis.com/auth/spreadsheets';

const DELETE_PASSWORD = '288288';   // 刪除記錄專用密碼（獨立於管理密碼）
let tokenClient;
let gapiInited = false, gisInited = false, gapiReady = false;
let settingsPassword = 'admin123';
let darkMode = localStorage.getItem('darkMode') === 'true';

// 全域資料
let staffList = [
    { code: "1", name: "Roy" },
    { code: "2", name: "Ken" },
    { code: "3", name: "Kin" }
];
let productList = [
    { name: "紅罐", price: 178 },
    { name: "猩猩粉", price: 100 },
    { name: "打底水", price: 148 }
];
let presetAmounts = [50, 100, 150, 200];
let records = [];
let selectedProducts = new Set();
let selectedSalesStaff = null;
let selectedConsumeStaff = null;
let selectedSalesPayment = "現金";
let selectedConsumePayment = "現金";
let lastSalesRecord = null;
let lastConsumeRecord = null;
const PAYMENTS = ["現金", "轉數快", "支付寶", "PayMe", "微信支付"];
const SALES_PAYMENTS = ["現金", "轉數快", "支付寶", "PayMe", "微信支付", "公司"];

let toggleStaff = false, toggleProduct = false, togglePreset = false;
let toggleSalesRecords = false, toggleConsumeRecords = false;
let buttonsPerRow = 3;

// ========== 密碼驗證狀態（1分鐘有效） ==========
let passwordAuth = {
    verified: false,
    expireTime: 0
};

// 檢查密碼是否在有效期內
function isPasswordValid() {
    return passwordAuth.verified && Date.now() < passwordAuth.expireTime;
}

// 要求密碼驗證（若1分鐘內已驗證則直接返回true）
async function requirePassword() {
    if (isPasswordValid()) return true;
    const pwd = prompt("請輸入管理密碼（驗證後1分鐘內無需重複輸入）");
    if (pwd === settingsPassword) {
        passwordAuth.verified = true;
        passwordAuth.expireTime = Date.now() + 60 * 1000;
        return true;
    } else {
        if (pwd !== null) alert("密碼錯誤");
        return false;
    }
}

// 重置密碼驗證狀態（可選，登出時可用）
function resetPasswordAuth() {
    passwordAuth.verified = false;
    passwordAuth.expireTime = 0;
}

// ========== 輔助函數（日期、顯示等） ==========
function formatDisplayDate(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return dateStr;
    return `${d.getMonth()+1}月${d.getDate()}`;
}
function toGoogleDate(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return dateStr;
    const day = d.getDate().toString().padStart(2,'0');
    const month = (d.getMonth()+1).toString().padStart(2,'0');
    const year = d.getFullYear();
    return `${day}/${month}/${year}`;
}
function extractYearMonthDay(googleDate) {
    if (!googleDate) return { year: '', month: '', day: '' };
    const parts = googleDate.split('/');
    if (parts.length === 3) {
        return { day: parts[0], month: parts[1], year: parts[2] };
    }
    return { year: '', month: '', day: '' };
}
function getCurrentTime() {
    const now = new Date();
    return `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;
}

// 本地儲存相關函數（不變）
function loadLocalData() {
    const storedStaff = localStorage.getItem("staffList");
    if (storedStaff) staffList = JSON.parse(storedStaff);
    const storedProducts = localStorage.getItem("productList");
    if (storedProducts) productList = JSON.parse(storedProducts);
    const storedPresets = localStorage.getItem("presetAmounts");
    if (storedPresets) presetAmounts = JSON.parse(storedPresets);
    const storedRecords = localStorage.getItem("salesRecords");
    if (storedRecords) records = JSON.parse(storedRecords);
    const storedToggles = localStorage.getItem("settingsToggles");
    if (storedToggles) {
        const toggles = JSON.parse(storedToggles);
        toggleStaff = toggles.staff || false;
        toggleProduct = toggles.product || false;
        togglePreset = toggles.preset || false;
        toggleSalesRecords = toggles.salesRecords || false;
        toggleConsumeRecords = toggles.consumeRecords || false;
    }
    const storedPerRow = localStorage.getItem('buttonsPerRow');
    if (storedPerRow) buttonsPerRow = parseInt(storedPerRow);
}
function saveStaff() { localStorage.setItem("staffList", JSON.stringify(staffList)); }
function saveProducts() { localStorage.setItem("productList", JSON.stringify(productList)); }
function savePresets() { localStorage.setItem("presetAmounts", JSON.stringify(presetAmounts)); }
function saveRecords() { localStorage.setItem("salesRecords", JSON.stringify(records)); }
function saveToggles() {
    localStorage.setItem("settingsToggles", JSON.stringify({
        staff: toggleStaff,
        product: toggleProduct,
        preset: togglePreset,
        salesRecords: toggleSalesRecords,
        consumeRecords: toggleConsumeRecords
    }));
}
function setDarkMode(enabled) {
    darkMode = enabled;
    if (enabled) document.body.classList.add('dark');
    else document.body.classList.remove('dark');
    localStorage.setItem('darkMode', enabled);
}

// ========== Google Sheets 操作（保留標題行） ==========
const CONFIG_SHEET = 'staff';

// 清除工作表從 A2 開始的所有數據（保留標題行）
async function clearSheetData(sheetName) {
    // 先獲取工作表現有數據範圍，清除 A2:Z 區域
    const range = `${sheetName}!A2:Z`;
    await gapi.client.sheets.spreadsheets.values.clear({ spreadsheetId: SPREADSHEET_ID, range: range });
}

// 追加一行數據（始終從最後非空行之後寫入）
async function appendToSheet(sheetName, values) {
    const range = `${sheetName}!A:Z`;
    await gapi.client.sheets.spreadsheets.values.append({
        spreadsheetId: SPREADSHEET_ID,
        range: range,
        valueInputOption: 'USER_ENTERED',
        resource: { values: [values] }
    });
}

// 同步配置表（員工、產品、預設金額、密碼）到雲端，保留標題行
async function syncConfigToSheet() {
    if (!gapiReady) return;
    try {
        await clearSheetData(CONFIG_SHEET);
        // 寫入員工（類型 employee, 工號, 姓名）
        for (let s of staffList) await appendToSheet(CONFIG_SHEET, ['employee', s.code, s.name]);
        // 寫入產品（類型 product, 名稱, 價格）
        for (let p of productList) await appendToSheet(CONFIG_SHEET, ['product', p.name, p.price.toString()]);
        // 寫入預設金額（類型 preset, 金額, 金額）
        for (let amt of presetAmounts) await appendToSheet(CONFIG_SHEET, ['preset', amt.toString(), amt.toString()]);
        // 寫入密碼（類型 password, admin, 密碼）
        await appendToSheet(CONFIG_SHEET, ['password', 'admin', settingsPassword]);
    } catch (err) { console.error("同步設定失敗", err); }
}

// 從雲端讀取配置表（跳過標題行）
async function loadConfigFromSheet() {
    if (!gapiReady) return;
    try {
        const resp = await gapi.client.sheets.spreadsheets.values.get({ spreadsheetId: SPREADSHEET_ID, range: `${CONFIG_SHEET}!A:C` });
        if (resp.result.values && resp.result.values.length > 1) {
            const rows = resp.result.values.slice(1); // 跳過第一行標題
            const newStaff = [], newProducts = [], newPresets = [];
            let newPassword = null;
            for (let row of rows) {
                const type = row[0], key = row[1], val = row[2];
                if (type === 'employee') newStaff.push({ code: key, name: val });
                else if (type === 'product') newProducts.push({ name: key, price: parseFloat(val) });
                else if (type === 'preset') newPresets.push(parseFloat(val));
                else if (type === 'password' && key === 'admin') newPassword = val;
            }
            if (newStaff.length) staffList = newStaff;
            if (newProducts.length) productList = newProducts;
            if (newPresets.length) presetAmounts = newPresets;
            if (newPassword) settingsPassword = newPassword;
            saveStaff(); saveProducts(); savePresets();
        }
        renderUI();
    } catch (err) { console.error("讀取設定失敗", err); }
}

// 從雲端拉取所有銷售/消費記錄（跳過標題行）並合併到本地
async function pullAllRecordsFromSheets() {
    if (!gapiReady) {
        showToast("未登入，無法從雲端拉取");
        return false;
    }
    try {
        // 拉取產品工作表（標題行 A1 已佔用）
        const salesResp = await gapi.client.sheets.spreadsheets.values.get({ spreadsheetId: SPREADSHEET_ID, range: '產品!A:K' });
        const consumeResp = await gapi.client.sheets.spreadsheets.values.get({ spreadsheetId: SPREADSHEET_ID, range: '客人!A:G' });

        const cloudRecords = [];
        // 解析產品工作表 (列: 年,月,日,員工,工號,產品,價錢,支付方式,時間,同步狀態, recordId)
        if (salesResp.result.values && salesResp.result.values.length > 1) {
            const rows = salesResp.result.values.slice(1);
            for (let row of rows) {
                if (row.length < 10) continue;
                const recordId = row.length >= 11 ? row[10] : null;
                const year = row[0], month = row[1], day = row[2];
                let isoDate = '';
                if (year && month && day) {
                    isoDate = `${year}-${month.padStart(2,'0')}-${day.padStart(2,'0')}`;
                } else {
                    isoDate = new Date().toISOString().slice(0,10);
                }
                cloudRecords.push({
                    id: recordId || `legacy_${Date.now()}_${Math.random()}`,
                    type: 'sales',
                    date: isoDate,
                    staffCode: row[4] || '',
                    staffName: row[3] || '',
                    productName: row[5] || '',
                    productPrice: parseFloat(row[6]) || 0,
                    amount: parseFloat(row[6]) || 0,
                    payment: row[7] || '',
                    syncStatus: 'success',
                    createdAt: new Date().toISOString()
                });
            }
        }
        // 解析客人工作表 (列: 日子(dd/mm/yyyy),員工,價錢,支付方式,時間,同步狀態, recordId)
        if (consumeResp.result.values && consumeResp.result.values.length > 1) {
            const rows = consumeResp.result.values.slice(1);
            for (let row of rows) {
                if (row.length < 3) continue;
                const recordId = row.length >= 7 ? row[6] : null;
                const googleDate = row[0];
                let isoDate = '';
                const parts = googleDate.split('/');
                if (parts.length === 3) {
                    isoDate = `${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`;
                } else {
                    isoDate = new Date().toISOString().slice(0,10);
                }
                cloudRecords.push({
                    id: recordId || `legacy_${Date.now()}_${Math.random()}`,
                    type: 'consumption',
                    date: isoDate,
                    staffName: row[1] || '',
                    staffCode: '',
                    amount: parseFloat(row[2]) || 0,
                    payment: row[3] || '',
                    syncStatus: 'success',
                    createdAt: new Date().toISOString()
                });
            }
        }

        // 合併：以 id 為準，雲端記錄覆蓋本地相同 id，雲端有而本地無則新增
        const localMap = new Map(records.map(r => [r.id, r]));
        for (const cloudRec of cloudRecords) {
            if (localMap.has(cloudRec.id)) {
                Object.assign(localMap.get(cloudRec.id), cloudRec);
                localMap.get(cloudRec.id).syncStatus = 'success';
                delete localMap.get(cloudRec.id).syncError;
            } else {
                localMap.set(cloudRec.id, cloudRec);
            }
        }
        records = Array.from(localMap.values());
        saveRecords();
        renderRecordsTables();
        showToast(`已從雲端拉取 ${cloudRecords.length} 筆記錄，合併後本地共 ${records.length} 筆`);
        return true;
    } catch (err) {
        console.error("拉取雲端記錄失敗", err);
        showToast("拉取雲端記錄失敗: " + err.message);
        return false;
    }
}

// 全量同步記錄到雲端（保留標題行）
async function fullSyncToSheets() {
    if (!gapiReady) {
        showToast("未登入，無法同步至雲端");
        return false;
    }
    try {
        await clearSheetData('產品');
        await clearSheetData('客人');
        for (const rec of records) {
            const sheetName = rec.type === 'sales' ? '產品' : '客人';
            let row;
            if (rec.type === 'sales') {
                const googleDate = toGoogleDate(rec.date);
                const { year, month, day } = extractYearMonthDay(googleDate);
                const time = getCurrentTime();
                row = [
                    year, month, day,
                    rec.staffName, rec.staffCode,
                    rec.productName,
                    rec.amount.toString(),
                    rec.payment,
                    time,
                    'success',
                    rec.id
                ];
            } else {
                const googleDate = toGoogleDate(rec.date);
                const time = getCurrentTime();
                row = [googleDate, rec.staffName, rec.amount.toString(), rec.payment, time, 'success', rec.id];
            }
            await appendToSheet(sheetName, row);
        }
        records.forEach(r => { r.syncStatus = 'success'; delete r.syncError; });
        saveRecords();
        renderRecordsTables();
        showToast("全量同步完成，工作表已更新");
        return true;
    } catch (err) {
        console.error("全量同步失敗", err);
        showToast("全量同步失敗: " + err.message);
        return false;
    }
}

// 新增記錄（僅本地，不自動同步，由外部控制全量同步）
async function addRecord(recordData) {
    const newId = Date.now() + "_" + Math.random().toString(36).substr(2, 6);
    const newRecord = {
        id: newId,
        syncStatus: "pending",
        ...recordData,
        displayDate: formatDisplayDate(recordData.date)
    };
    records.unshift(newRecord);
    saveRecords();
    renderRecordsTables();
    if (recordData.type === 'sales') {
        lastSalesRecord = { ...newRecord };
        updateRecentRecord('sales');
    } else {
        lastConsumeRecord = { ...newRecord };
        updateRecentRecord('consumption');
    }
    return newRecord;
}

// 刪除記錄（需要 DELETE_PASSWORD 驗證，且調用 fullSyncToSheets）
async function deleteRecordById(id) {
    const pwd = prompt("請輸入刪除密碼");
    if (pwd !== DELETE_PASSWORD) {
        alert("密碼錯誤，無法刪除");
        return false;
    }
    const index = records.findIndex(r => r.id === id);
    if (index === -1) return false;
    records.splice(index, 1);
    saveRecords();
    await fullSyncToSheets();
    renderRecordsTables();
    showToast("記錄已刪除並同步雲端");
    return true;
}

// 編輯記錄（需要 DELETE_PASSWORD 驗證，且調用 fullSyncToSheets）
async function editRecord(record) {
    const pwd = prompt("請輸入刪除密碼（修改操作需要驗證）");
    if (pwd !== DELETE_PASSWORD) {
        alert("密碼錯誤，無法修改");
        return false;
    }
    let newData = {};
    if (record.type === 'sales') {
        const newProduct = prompt("輸入新產品名稱", record.productName);
        const newPrice = parseFloat(prompt("輸入新價格", record.productPrice));
        const newPayment = prompt("輸入新支付方式（現金/轉數快/支付寶/PayMe/微信支付/公司）", record.payment);
        if (newProduct && !isNaN(newPrice) && newPayment) {
            newData.productName = newProduct.trim();
            newData.productPrice = newPrice;
            newData.amount = newPrice;
            newData.payment = newPayment;
        } else {
            alert("修改無效");
            return false;
        }
    } else {
        const newAmount = parseFloat(prompt("輸入新金額", record.amount));
        const newPayment = prompt("輸入新支付方式（現金/轉數快/支付寶/PayMe/微信支付）", record.payment);
        if (!isNaN(newAmount) && newAmount > 0 && newPayment) {
            newData.amount = newAmount;
            newData.payment = newPayment;
        } else {
            alert("修改無效");
            return false;
        }
    }
    Object.assign(record, newData);
    saveRecords();
    await fullSyncToSheets();
    renderRecordsTables();
    showToast("記錄已修改並同步雲端");
    return true;
}

        div.style.display = 'block';
        div.innerHTML = `📌 最近一筆銷售：${lastSalesRecord.displayDate} ${lastSalesRecord.staffName} | 產品：${lastSalesRecord.productName} 金額 $${lastSalesRecord.amount} | ${lastSalesRecord.payment}`;
    } else if (type === 'consumption' && lastConsumeRecord) {
        div.style.display = 'block';

}

// 提交銷售（先拉取合併，新增，全量同步）
async function submitSales() {
    if (!gapiReady) alert("尚未登入，記錄將先儲存於本地，登入後自動同步");
    const date = document.getElementById("salesDate").value;
    if (!date) { alert("請選擇日期"); return; }
    if (!selectedSalesStaff) { alert("請選擇員工"); return; }
    let payment = selectedSalesPayment;
    let total = 0;
    const selected = [];
    productList.forEach(p => { if (selectedProducts.has(p.name)) { selected.push(p); total += p.price; } });
    if (selected.length === 0 && payment !== "公司") { alert("請至少選擇一件產品"); return; }
    if (payment === "公司") total = 0;

    if (gapiReady) await pullAllRecordsFromSheets();

    for (const prod of selected) {
        await addRecord({
            type: "sales",
            date: date,
            staffCode: selectedSalesStaff.code,
            staffName: selectedSalesStaff.name,
            productName: prod.name,
            productPrice: prod.price,
            amount: payment === "公司" ? 0 : prod.price,
            payment: payment,
            createdAt: new Date().toISOString()
        });
    }
    if (payment === "公司" && selected.length === 0) {
        await addRecord({
            type: "sales",
            date: date,
            staffCode: selectedSalesStaff.code,
            staffName: selectedSalesStaff.name,
            productName: "（無產品）",
            productPrice: 0,
            amount: 0,
            payment: "公司",
            createdAt: new Date().toISOString()
        });
    }
    if (gapiReady) await fullSyncToSheets();
    showToast(`✅ 訂單已完成！總共 ${selected.length} 件產品，總金額 ${total} 元`);
    selectedProducts.clear();
    renderProducts();
    document.getElementById("salesDate").value = new Date().toISOString().slice(0,10);
    selectedSalesPayment = "現金";
    renderPayment("salesPayment", selectedSalesPayment, (p) => selectedSalesPayment = p, true);
}
async function submitConsumption() {
    if (!gapiReady) alert("尚未登入，記錄將先儲存於本地，登入後自動同步");
    const date = document.getElementById("consumeDate").value;
    if (!date) { alert("請選擇日期"); return; }
    if (!selectedConsumeStaff) { alert("請選擇員工"); return; }
    let amount = parseFloat(document.getElementById("consumeAmount").value);
    if (isNaN(amount) || amount <= 0) { alert("請輸入正確金額或點選預設金額按鈕"); return; }
    const payment = selectedConsumePayment;
    if (gapiReady) await pullAllRecordsFromSheets();
    await addRecord({
        type: "consumption",
        date: date,
        staffCode: selectedConsumeStaff.code,
        staffName: selectedConsumeStaff.name,
        amount: amount,
        payment: payment,
        createdAt: new Date().toISOString()
    });
    if (gapiReady) await fullSyncToSheets();
    showToast(`✅ 消費記錄已完成！\n金額: $${amount}\n支付: ${payment}`);
    document.getElementById("consumeAmount").value = "";
    clearPresetHighlight();
}

// 顯示頁面
function showPage(pageId) {
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    document.getElementById(pageId + "Page").classList.add("active");
    document.querySelectorAll(".nav-btn").forEach(btn => {
        if (btn.dataset.page === pageId) btn.classList.add("active");
        else btn.classList.remove("active");
    });
    if (pageId === "sales") {
        document.getElementById("salesDate").value = new Date().toISOString().slice(0,10);
        renderProducts();
        updateRecentRecord('sales');
        renderPayment("salesPayment", selectedSalesPayment, (p) => selectedSalesPayment = p, true);
    }
    if (pageId === "consumption") {
        document.getElementById("consumeDate").value = new Date().toISOString().slice(0,10);
        renderPresetButtons();
        updateRecentRecord('consumption');
        renderPayment("consumePayment", selectedConsumePayment, (p) => selectedConsumePayment = p, false);
    }
    if (pageId === "settings") {
        renderStaffManageList(); renderProductManageList(); renderPresetManageList(); renderRecordsTables();
        document.getElementById("toggleStaff").classList.toggle("active", toggleStaff);
        document.getElementById("toggleProduct").classList.toggle("active", toggleProduct);
        document.getElementById("togglePreset").classList.toggle("active", togglePreset);
        document.getElementById("toggleSalesRecords").classList.toggle("active", toggleSalesRecords);
        document.getElementById("toggleConsumeRecords").classList.toggle("active", toggleConsumeRecords);
        document.getElementById("staffContent").classList.toggle("hidden-content", !toggleStaff);
        document.getElementById("productContent").classList.toggle("hidden-content", !toggleProduct);
        document.getElementById("presetContent").classList.toggle("hidden-content", !togglePreset);
        document.getElementById("salesRecordsContent").classList.toggle("hidden-content", !toggleSalesRecords);
        document.getElementById("consumeRecordsContent").classList.toggle("hidden-content", !toggleConsumeRecords);
        document.getElementById("toggleDarkMode").classList.toggle("active", darkMode);

}

// ========== 初始化與登入 ==========
function gapiLoaded() { gapi.load('client', initGapiClient); }
async function initGapiClient() {
    await gapi.client.init({ discoveryDocs: ['https://sheets.googleapis.com/$discovery/rest?version=v4'] });
    gapiInited = true; maybeEnableButtons();
}
function gisLoaded() {
    tokenClient = google.accounts.oauth2.initTokenClient({ client_id: CLIENT_ID, scope: SCOPES, callback: '' });
    gisInited = true; maybeEnableButtons();
}
function maybeEnableButtons() {
    if (gapiInited && gisInited && !gapiReady) {
        gapiReady = true;
        document.getElementById('loginStatus').innerHTML = '✅ 已準備就緒，請按下方按鈕登入授權 <button id="authBtn">登入 Google</button>';
        document.getElementById('authBtn').onclick = () => {
            tokenClient.callback = async (resp) => {
                if (resp.error !== undefined) throw resp;
                document.getElementById('loginStatus').innerHTML = '✅ 已登入並授權，可以開始使用賣貨系統！';
                await loadConfigFromSheet();
                await pullAllRecordsFromSheets();
                renderUI();
            };
            tokenClient.requestAccessToken();
        };
    }
}
function renderUI() {
    renderStaff("salesStaff", selectedSalesStaff?.code, (c,n) => selectedSalesStaff = { code:c, name:n });
    renderStaff("consumeStaff", selectedConsumeStaff?.code, (c,n) => selectedConsumeStaff = { code:c, name:n });
    renderPayment("salesPayment", selectedSalesPayment, (p) => selectedSalesPayment = p, true);
    renderPayment("consumePayment", selectedConsumePayment, (p) => selectedConsumePayment = p, false);
    renderProducts(); renderPresetButtons(); renderRecordsTables();
    renderStaffManageList(); renderProductManageList(); renderPresetManageList();
    updateRecentRecord('sales'); updateRecentRecord('consumption');
    initToggles(); setDarkMode(darkMode);
    showPage("sales");
    setButtonsPerRow(buttonsPerRow);
}
function ensureInit() {
    if (typeof gapi !== 'undefined' && typeof google !== 'undefined' && typeof google.accounts !== 'undefined') {
        if (!gapiInited) gapiLoaded();
        if (!gisInited) gisLoaded();
    } else setTimeout(ensureInit, 200);
}
window.addEventListener('load', () => { loadLocalData(); renderUI(); ensureInit(); });
