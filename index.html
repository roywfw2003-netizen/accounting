<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>Hair World系統</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root { --accent-orange: #f97316; --btn-success: #22c55e; --bg-card: white; }
        body { margin:0; font-family:system-ui; background:#cfe7ff; min-height:100vh; }
        body.dark { background:#1f2937; color:#f3f4f6; }
        #loginPanel { position:fixed; top:0; left:0; width:100%; height:100%; background:#cfe7ff; display:flex; align-items:center; justify-content:center; z-index:9999; }
        .login-card { background:white; padding:40px 30px; border-radius:30px; box-shadow:0 15px 40px rgba(0,0,0,0.2); text-align:center; max-width:340px; width:90%; }
        .app-container { display:none; padding:15px; }
        .nav-btn { background:#f1f5f9; border:none; border-radius:9999px; padding:12px 16px; margin:5px; font-weight:bold; }
        .nav-btn.active { background:var(--accent-orange); color:white; }
        .submit-btn { background:var(--btn-success); color:white; border:none; padding:14px; border-radius:9999px; width:100%; font-weight:bold; margin-top:10px; }
        .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--accent-orange); color:white; padding:10px 20px; border-radius:9999px; z-index:10000; }
    </style>
</head>
<body>
<div id="loginPanel">
    <div class="login-card">
        <i class="fa-solid fa-lock" style="font-size:3.5rem;color:var(--accent-orange);margin-bottom:16px;"></i>
        <h2>Hair World系統</h2>
        <p>請使用 Google 帳號登入</p>
        <button id="googleLoginBtn" style="background:#4285f4;color:white;border:none;padding:14px 24px;border-radius:9999px;font-size:1.1rem;width:100%;margin-top:20px;cursor:pointer;">
            🔐 使用 Google 登入
        </button>
        <p style="margin-top:20px;font-size:0.85rem;color:#666;">如果彈出視窗被阻擋，請允許或使用無痕模式測試</p>
    </div>
</div>


<div class="app-container">
    <div id="navButtons" style="margin-bottom:20px;"></div>
    <div id="mainContent">
        <h2>登入成功！</h2>
        <p>現在你可以測試提交銷售 / 消費等功能。</p>
        <button onclick="logoutTest()" style="margin-top:20px;">測試登出（清除 token）</button>
    </div>
</div>


<script>
// ==================== Google 登入核心（最穩定版本） ====================
const CLIENT_ID = '448045465424-kg6sd2dhp0nu8bl4afnafhpmd9f8bhj2.apps.googleusercontent.com';
const SPREADSHEET_ID = '1qqtTlgJoLdaDkNQVfzjyyEBbyvmcYB_3IQHRUnCPRMU';
const SCOPES = 'https://www.googleapis.com/auth/spreadsheets';


let tokenClient;
let gapiInited = false;
let gisInited = false;
let gapiReady = false;


function gapiLoaded() {
    gapi.load('client', async () => {
        try {
            await gapi.client.init({ discoveryDocs: ['https://sheets.googleapis.com/$discovery/rest?version=v4'] });
            gapiInited = true;
            maybeEnableLogin();
        } catch(e) { console.error("gapi init error", e); }
    });
}


function gisLoaded() {
    tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: handleTokenResponse,
        error_callback: (err) => {
            console.error("Token error:", err);
            alert("登入失敗，請檢查 popup 是否被阻擋");
        }
    });
    gisInited = true;
    maybeEnableLogin();
}


function maybeEnableLogin() {
    if (gapiInited && gisInited && !gapiReady) {
        gapiReady = true;
        console.log("✅ Google API 準備完成");
    }
}


function handleTokenResponse(resp) {
    if (resp.error) {
        console.error(resp);
        alert("登入失敗：" + (resp.error_description || resp.error));
        return;
    }
    console.log("✅ Google 登入成功！Token 已取得");
    document.getElementById('loginPanel').style.display = 'none';
    document.querySelector('.app-container').style.display = 'block';
    // 在這裡加入你的 renderUI() 或其他初始化
    initAppAfterLogin();
}


document.getElementById('googleLoginBtn').onclick = () => {
    if (!tokenClient) {
        alert("Google 登入尚未準備好，請重新整理頁面");
        return;
    }
    tokenClient.requestAccessToken({ prompt: '' });
};


// ==================== 登入後初始化 ====================
function initAppAfterLogin() {
    // 這裡放你的主要功能初始化
    document.getElementById("mainContent").innerHTML += "<p style='color:green;'>Google Sheets 連線正常，可以開始使用系統。</p>";
    showToast("登入成功！");
}


function showToast(msg) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3000);
}


function logoutTest() {
    document.getElementById('loginPanel').style.display = 'flex';
    document.querySelector('.app-container').style.display = 'none';
    showToast("已返回登入畫面（測試用）");
}


// ==================== 頁面載入 ====================
window.addEventListener('load', () => {
    // 載入 Google API
    const apiScript = document.createElement('script');
    apiScript.src = "https://apis.google.com/js/api.js";
    apiScript.onload = gapiLoaded;
    document.head.appendChild(apiScript);


    const gsiScript = document.createElement('script');
    gsiScript.src = "https://accounts.google.com/gsi/client";
    gsiScript.onload = gisLoaded;
    document.head.appendChild(gsiScript);


    console.log("🚀 頁面載入完成，正在初始化 Google 登入...");
});
</script>
</body>
</html>
