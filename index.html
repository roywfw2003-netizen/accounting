// 輔助函數
function formatDisplayDate(dateStr) {
    if (!dateStr) return '日期遺失';
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return '日期無效';
    return `${d.getMonth()+1}月${d.getDate()}`;
}
function toGoogleDate(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return '';
    const day = d.getDate().toString().padStart(2,'0');
    const month = (d.getMonth()+1).toString().padStart(2,'0');
    const year = d.getFullYear();
    return `${day}/${month}/${year}`;
}
function extractYearMonthDay(googleDate) {
    if (!googleDate) return { year: '', month: '', day: '' };
    const parts = googleDate.split('/');
    if (parts.length === 3) return { day: parts[0], month: parts[1], year: parts[2] };
    return { year: '', month: '', day: '' };
}
function getCurrentTime() {
    const now = new Date();
    return `${now.getFullYear()}-${(now.getMonth()+1).toString().padStart(2,'0')}-${now.getDate().toString().padStart(2,'0')} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;
}
function getTodayISO() {
    return new Date().toISOString().slice(0,10);
}
function ensureValidDate(dateStr) {
    if (!dateStr) return getTodayISO();
    const d = new Date(dateStr);
    return isNaN(d.getTime()) ? getTodayISO() : dateStr;
}

function setButtonsPerRow(count) {

}

function loadLocalData() {
    const storedStaff = localStorage.getItem("staffList");
    if (storedStaff) staffList = JSON.parse(storedStaff);

    const storedPresets = localStorage.getItem("presetAmounts");
    if (storedPresets) presetAmounts = JSON.parse(storedPresets);
    const storedRecords = localStorage.getItem("salesRecords");
    if (storedRecords) records = JSON.parse(storedRecords);
    records.forEach(r => { if (!r.displayDate) r.displayDate = formatDisplayDate(r.date); });
    const storedToggles = localStorage.getItem("settingsToggles");
    if (storedToggles) {
        const toggles = JSON.parse(storedToggles);
        toggleStaff = toggles.staff || false;
        toggleProduct = toggles.product || false;
        togglePreset = toggles.preset || false;
        toggleSalesRecords = toggles.salesRecords || false;
        toggleConsumeRecords = toggles.consumeRecords || false;
    }
    const storedPerRow = localStorage.getItem('buttonsPerRow');
    if (storedPerRow) buttonsPerRow = parseInt(storedPerRow);
}
function saveStaff() { localStorage.setItem("staffList", JSON.stringify(staffList)); }
function saveProducts() { localStorage.setItem("productList", JSON.stringify(productList)); }
function savePresets() { localStorage.setItem("presetAmounts", JSON.stringify(presetAmounts)); }
function saveRecords() { localStorage.setItem("salesRecords", JSON.stringify(records)); }
function saveToggles() {

}
function setDarkMode(enabled) {

const CONFIG_SHEET = 'staff';

// ---------- Google Sheets 核心操作 ----------
async function ensureSheetExists(sheetName, headers) {
    try {
        const resp = await gapi.client.sheets.spreadsheets.get({ spreadsheetId: SPREADSHEET_ID });
        const sheets = resp.result.sheets;
        const exists = sheets.some(s => s.properties.title === sheetName);
        if (!exists) {
            await gapi.client.sheets.spreadsheets.batchUpdate({
                spreadsheetId: SPREADSHEET_ID,
                resource: { requests: [{ addSheet: { properties: { title: sheetName } } }] }
            });
            await gapi.client.sheets.spreadsheets.values.update({
                spreadsheetId: SPREADSHEET_ID,
                range: `${sheetName}!A1:${String.fromCharCode(65+headers.length-1)}1`,
                valueInputOption: 'USER_ENTERED',
                resource: { values: [headers] }
            });
        }
    } catch(e) { console.error(`確保工作表 ${sheetName} 失敗`, e); }
}

async function appendToSheet(sheetName, record) {
    let values;
    if (sheetName === '產品') {
        const googleDate = toGoogleDate(record.date);
        const { year, month, day } = extractYearMonthDay(googleDate);
        const time = getCurrentTime();
        values = [[year, month, day, record.staffName, record.staffCode, record.productName, record.amount.toString(), record.payment, time, 'success', record.id]];
    } else if (sheetName === '客人') {
        const googleDate = toGoogleDate(record.date);
        const time = getCurrentTime();
        values = [[googleDate, record.staffName, record.staffCode, record.amount.toString(), record.payment, time, 'success', record.id]];
    } else {
        // 設定工作表
        values = [[record[0], record[1], record[2]]];
    }
    await gapi.client.sheets.spreadsheets.values.append({
        spreadsheetId: SPREADSHEET_ID,
        range: `${sheetName}!A:Z`,
        valueInputOption: 'USER_ENTERED',
        resource: { values: values }
    });
}

async function appendToBackup(sheetName, record, operationType) {
    const backupSheetName = sheetName === '產品' ? '產品Backup' : '客人Backup';
    let headers = [];
    if (sheetName === '產品') {
        headers = ["年份","月份","日期","員工姓名","員工工號","產品名稱","金額","支付方式","時間","同步狀態","訂單編號"];
    } else {
        headers = ["日期","員工姓名","員工工號","金額","支付方式","時間","同步狀態","訂單編號"];
    }
    await ensureSheetExists(backupSheetName, [...headers, "操作類型", "操作時間"]);
    let rowData = [];
    if (sheetName === '產品') {
        const googleDate = toGoogleDate(record.date);
        const { year, month, day } = extractYearMonthDay(googleDate);
        const time = getCurrentTime();
        rowData = [year, month, day, record.staffName, record.staffCode, record.productName, record.amount.toString(), record.payment, time, 'success', record.id];
    } else {
        const googleDate = toGoogleDate(record.date);
        const time = getCurrentTime();
        rowData = [googleDate, record.staffName, record.staffCode, record.amount.toString(), record.payment, time, 'success', record.id];
    }
    rowData.push(operationType, getCurrentTime());
    await gapi.client.sheets.spreadsheets.values.append({
        spreadsheetId: SPREADSHEET_ID,
        range: `${backupSheetName}!A:Z`,
        valueInputOption: 'USER_ENTERED',
        resource: { values: [rowData] }
    });
}

async function getRowMap(sheetName) {
    const resp = await gapi.client.sheets.spreadsheets.values.get({ spreadsheetId: SPREADSHEET_ID, range: `${sheetName}!A:Z` });
    const rows = resp.result.values || [];
    if (rows.length <= 1) return new Map();
    const idColIndex = (sheetName === '產品') ? 10 : 7;
    const map = new Map();
    for (let i = 1; i < rows.length; i++) {
        const row = rows[i];
        if (row.length > idColIndex && row[idColIndex]) {
            map.set(row[idColIndex], i+1);
        }
    }
    return map;
}

async function updateSheetRow(sheetName, rowIndex, record) {
    let values;
    if (sheetName === '產品') {
        const googleDate = toGoogleDate(record.date);
        const { year, month, day } = extractYearMonthDay(googleDate);
        const time = getCurrentTime();
        values = [[year, month, day, record.staffName, record.staffCode, record.productName, record.amount.toString(), record.payment, time, 'success', record.id]];

        range: `${sheetName}!A${rowIndex}:Z${rowIndex}`,

async function deleteSheetRow(sheetName, rowIndex) {
    const sheetId = await getSheetId(sheetName);
    await gapi.client.sheets.spreadsheets.batchUpdate({
        spreadsheetId: SPREADSHEET_ID,
        resource: {
            requests: [{
                deleteDimension: {
                    range: { sheetId: sheetId, dimension: "ROWS", startIndex: rowIndex-1, endIndex: rowIndex }
                }
            }]
        }
    });
}
async function getSheetId(sheetName) {
    const resp = await gapi.client.sheets.spreadsheets.get({ spreadsheetId: SPREADSHEET_ID });
    const sheet = resp.result.sheets.find(s => s.properties.title === sheetName);
    return sheet.properties.sheetId;
}

async function clearSheetData(sheetName) {
    const range = `${sheetName}!A2:Z`;
    await gapi.client.sheets.spreadsheets.values.clear({ spreadsheetId: SPREADSHEET_ID, range: range });
}

async function fullSyncToSheets() {
    if (!gapiReady) { showToast("未登入，無法同步"); return false; }
    try {
        await ensureSheetExists('產品', ["年份","月份","日期","員工姓名","員工工號","產品名稱","金額","支付方式","時間","同步狀態","訂單編號"]);
        await ensureSheetExists('客人', ["日期","員工姓名","員工工號","金額","支付方式","時間","同步狀態","訂單編號"]);
        await clearSheetData('產品');
        await clearSheetData('客人');
        for (const rec of records) {
            const sheetName = rec.type === 'sales' ? '產品' : '客人';
            await appendToSheet(sheetName, rec);
        }
        records.forEach(r => { r.syncStatus = 'success'; delete r.syncError; });
        saveRecords();
        renderRecordsTables();
        showToast("全量同步完成");
        return true;
    } catch (err) {
        console.error("全量同步失敗", err);
        showToast("全量同步失敗: " + err.message);
        return false;
    }
}

async function loadConfigFromSheet() {
    if (!gapiReady) return;
    try {
        const resp = await gapi.client.sheets.spreadsheets.values.get({ spreadsheetId: SPREADSHEET_ID, range: `${CONFIG_SHEET}!A:C` });
        if (resp.result.values && resp.result.values.length > 1) {
            const rows = resp.result.values.slice(1);
            const newStaff = [], newProducts = [], newPresets = [];
            let newPassword = null;
            for (let row of rows) {
                const type = row[0], key = row[1], val = row[2];
                if (type === 'employee') newStaff.push({ code: key, name: val });
                else if (type === 'product') newProducts.push({ name: key, price: parseFloat(val) });
                else if (type === 'preset') newPresets.push(parseFloat(val));
                else if (type === 'password' && key === 'admin') newPassword = val;
            }
            if (newStaff.length) staffList = newStaff;
            if (newProducts.length) productList = newProducts;
            if (newPresets.length) presetAmounts = newPresets;
            if (newPassword) settingsPassword = newPassword;
            saveStaff(); saveProducts(); savePresets();
        }
        renderUI();
    } catch (err) { console.error("讀取設定失敗", err); }
}

async function pullAllRecordsFromSheets() {
    if (!gapiReady) { showToast("未登入，無法從雲端拉取"); return false; }
    try {
        const salesResp = await gapi.client.sheets.spreadsheets.values.get({ spreadsheetId: SPREADSHEET_ID, range: '產品!A:K' });
        const consumeResp = await gapi.client.sheets.spreadsheets.values.get({ spreadsheetId: SPREADSHEET_ID, range: '客人!A:H' });
        const cloudRecords = [];
        if (salesResp.result.values && salesResp.result.values.length > 1) {
            for (let row of salesResp.result.values.slice(1)) {
                if (row.length < 10) continue;
                const recordId = row.length >= 11 ? row[10] : null;
                const year = row[0], month = row[1], day = row[2];
                let isoDate = '';
                if (year && month && day) isoDate = `${year}-${month.padStart(2,'0')}-${day.padStart(2,'0')}`;
                else isoDate = getTodayISO();
                cloudRecords.push({
                    id: recordId || `legacy_${Date.now()}_${Math.random()}`,
                    type: 'sales',
                    date: isoDate,
                    staffCode: row[4] || '',
                    staffName: row[3] || '',
                    productName: row[5] || '',
                    productPrice: parseFloat(row[6]) || 0,
                    amount: parseFloat(row[6]) || 0,
                    payment: row[7] || '',
                    syncStatus: 'success',
                    createdAt: new Date().toISOString(),
                    displayDate: formatDisplayDate(isoDate)
                });
            }
        }
        if (consumeResp.result.values && consumeResp.result.values.length > 1) {
            for (let row of consumeResp.result.values.slice(1)) {
                if (row.length < 3) continue;
                const recordId = row.length >= 8 ? row[7] : null;
                const googleDate = row[0];
                let isoDate = '';
                const parts = googleDate.split('/');
                if (parts.length === 3) isoDate = `${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`;
                else isoDate = getTodayISO();
                cloudRecords.push({
                    id: recordId || `legacy_${Date.now()}_${Math.random()}`,
                    type: 'consumption',
                    date: isoDate,
                    staffName: row[1] || '',
                    staffCode: row[2] || '',
                    amount: parseFloat(row[3]) || 0,
                    payment: row[4] || '',
                    syncStatus: 'success',
                    createdAt: new Date().toISOString(),
                    displayDate: formatDisplayDate(isoDate)
                });
            }
        }
        const localMap = new Map(records.map(r => [r.id, r]));
        for (const cloudRec of cloudRecords) {
            if (localMap.has(cloudRec.id)) {
                Object.assign(localMap.get(cloudRec.id), cloudRec);
                localMap.get(cloudRec.id).syncStatus = 'success';
                delete localMap.get(cloudRec.id).syncError;
            } else {
                localMap.set(cloudRec.id, cloudRec);
            }
        }
        records = Array.from(localMap.values());
        saveRecords();
        renderRecordsTables();
        showToast(`已從雲端拉取 ${cloudRecords.length} 筆記錄，合併後本地共 ${records.length} 筆`);
        return true;
    } catch (err) {
        console.error("拉取雲端記錄失敗", err);
        showToast("拉取雲端記錄失敗: " + err.message);
        return false;
    }
}

async function addRecord(recordData) {
    const newId = Date.now() + "_" + Math.random().toString(36).substr(2, 6);
    const safeDate = ensureValidDate(recordData.date);
    const newRecord = {
        id: newId,
        syncStatus: "pending",
        ...recordData,
        date: safeDate,
        displayDate: formatDisplayDate(safeDate),
        createdAt: new Date().toISOString()
    };
    records.unshift(newRecord);
    saveRecords();
    renderRecordsTables();
    if (recordData.type === 'sales') {
        lastSalesRecord = { ...newRecord };
        updateRecentRecord('sales');
    } else {
        lastConsumeRecord = { ...newRecord };
        updateRecentRecord('consumption');
    }
    if (gapiReady) {
        const sheetName = newRecord.type === 'sales' ? '產品' : '客人';
        await ensureSheetExists(sheetName, sheetName === '產品' ? ["年份","月份","日期","員工姓名","員工工號","產品名稱","金額","支付方式","時間","同步狀態","訂單編號"] : ["日期","員工姓名","員工工號","金額","支付方式","時間","同步狀態","訂單編號"]);
        await appendToSheet(sheetName, newRecord);
        await appendToBackup(sheetName, newRecord, "新增");
        newRecord.syncStatus = 'success';
        saveRecords();
        renderRecordsTables();
    }
    return newRecord;
}

async function editRecord(record, options = {}) {
    if (!options.skipPassword) {
        if (!await requirePassword()) return false;
    }
    if (!confirm("確定要修改此記錄嗎？")) return false;
    let newData = {};
    if (record.type === 'sales') {
        const newProduct = prompt("輸入新產品名稱", record.productName);
        const newPrice = parseFloat(prompt("輸入新價格", record.productPrice));
        const newPayment = prompt("輸入新支付方式", record.payment);
        if (newProduct && !isNaN(newPrice) && newPayment) {
            newData.productName = newProduct.trim();
            newData.productPrice = newPrice;
            newData.amount = newPrice;
            newData.payment = newPayment;
        } else { alert("修改無效"); return false; }
    } else {
        const newAmount = parseFloat(prompt("輸入新金額", record.amount));
        const newPayment = prompt("輸入新支付方式", record.payment);
        if (!isNaN(newAmount) && newAmount > 0 && newPayment) {
            newData.amount = newAmount;
            newData.payment = newPayment;
        } else { alert("修改無效"); return false; }
    }
    Object.assign(record, newData);
    saveRecords();
    if (gapiReady) {
        const sheetName = record.type === 'sales' ? '產品' : '客人';
        const rowMap = await getRowMap(sheetName);
        const rowIndex = rowMap.get(record.id);
        if (rowIndex) {
            await updateSheetRow(sheetName, rowIndex, record);
            await appendToBackup(sheetName, record, "修改");
        } else {
            await fullSyncToSheets();
        }
    }
    renderRecordsTables();
    updateRecentRecord(record.type === 'sales' ? 'sales' : 'consumption');
    showToast("記錄已修改並同步雲端");
    return true;
}

async function deleteRecordById(id, options = {}) {
    const recordToDelete = records.find(r => r.id === id);
    if (!recordToDelete) return false;
    const sameType = records.filter(r => r.type === recordToDelete.type);
    let isLatest = false;
    if (sameType.length > 0) {
        const latest = sameType.reduce((a,b) => new Date(b.createdAt || b.date) > new Date(a.createdAt || a.date) ? b : a);
        isLatest = (latest.id === id);
    }
    if (!isLatest) {
        if (!await requirePassword()) return false;
    } else {
        if (options.skipPassword) {
            const now = Date.now();
            if (now - lastQuickDeleteTime < 5000) {
                if (!await requirePassword()) return false;
            }
            lastQuickDeleteTime = now;
        } else {
            if (!await requirePassword()) return false;
        }
    }
    if (!confirm("確定要刪除此記錄嗎？此操作不可復原！")) return false;
    if (gapiReady) {
        const sheetName = recordToDelete.type === 'sales' ? '產品' : '客人';
        const rowMap = await getRowMap(sheetName);
        const rowIndex = rowMap.get(recordToDelete.id);
        if (rowIndex) {
            await appendToBackup(sheetName, recordToDelete, "刪除");
            await deleteSheetRow(sheetName, rowIndex);
        } else {
            await fullSyncToSheets();
        }
    }
    const index = records.findIndex(r => r.id === id);
    if (index !== -1) records.splice(index, 1);
    saveRecords();
    renderRecordsTables();
    updateRecentRecord(recordToDelete.type === 'sales' ? 'sales' : 'consumption');
    showToast("記錄已刪除並同步雲端");
    return true;
}

// 自定義修改模態框（最新記錄免密）
function showEditModal(record) {
    const modal = document.createElement('div');
    modal.className = 'edit-modal';
    const content = document.createElement('div');
    content.className = 'edit-modal-content';
    modal.appendChild(content);
    document.body.appendChild(modal);
    const title = document.createElement('h3');
    title.innerText = record.type === 'sales' ? '修改銷售記錄' : '修改消費記錄';
    content.appendChild(title);
    const optionGrid = document.createElement('div');
    optionGrid.className = 'edit-option-grid';
    if (record.type === 'sales') {
        const productLabel = document.createElement('div');
        productLabel.innerText = '選擇產品：';
        optionGrid.appendChild(productLabel);
        productList.forEach(prod => {
            const btn = document.createElement('div');
            btn.className = 'edit-option-btn';
            btn.innerText = `${prod.name} ($${prod.price})`;
            btn.onclick = () => {
                record.productName = prod.name;
                record.productPrice = prod.price;
                record.amount = prod.price;
                showPaymentSelection(record, modal);
            };
            optionGrid.appendChild(btn);
        });
        content.appendChild(optionGrid);
    } else {
        const amountLabel = document.createElement('div');
        amountLabel.innerText = '選擇金額：';
        optionGrid.appendChild(amountLabel);
        presetAmounts.forEach(amt => {
            const btn = document.createElement('div');
            btn.className = 'edit-option-btn';
            btn.innerText = `$${amt}`;
            btn.onclick = () => {
                record.amount = amt;
                showPaymentSelection(record, modal);
            };
            optionGrid.appendChild(btn);
        });
        content.appendChild(optionGrid);
    }
    function showPaymentSelection(record, modal) {
        while (content.children.length > 1) content.removeChild(content.lastChild);
        const paymentLabel = document.createElement('div');
        paymentLabel.innerText = '選擇支付方式：';
        content.appendChild(paymentLabel);
        const paymentGrid = document.createElement('div');
        paymentGrid.className = 'edit-option-grid';
        const payments = record.type === 'sales' ? SALES_PAYMENTS : PAYMENTS;
        payments.forEach(p => {
            const btn = document.createElement('div');
            btn.className = 'edit-option-btn';
            btn.innerText = p;
            btn.onclick = async () => {
                record.payment = p;
                await finalizeEdit(record, modal);
            };
            paymentGrid.appendChild(btn);
        });
        content.appendChild(paymentGrid);
        const cancelBtn = document.createElement('button');
        cancelBtn.innerText = '取消';
        cancelBtn.className = 'small-btn';
        cancelBtn.style.marginTop = '16px';
        cancelBtn.onclick = () => modal.remove();
        content.appendChild(cancelBtn);
    }
    async function finalizeEdit(record, modal) {
        saveRecords();
        if (gapiReady) {
            const sheetName = record.type === 'sales' ? '產品' : '客人';
            const rowMap = await getRowMap(sheetName);
            const rowIndex = rowMap.get(record.id);
            if (rowIndex) {
                await updateSheetRow(sheetName, rowIndex, record);
                await appendToBackup(sheetName, record, "修改");
            } else {
                await fullSyncToSheets();
            }
        }
        renderRecordsTables();
        updateRecentRecord(record.type === 'sales' ? 'sales' : 'consumption');
        showToast("記錄已修改並同步雲端");
        modal.remove();
    }
}

// 渲染記錄表格（含備份狀態）
async function renderRecordsTables() {
    const salesContainer = document.getElementById("salesRecordsTable");
    const consumeContainer = document.getElementById("consumeRecordsTable");
    if (!salesContainer || !consumeContainer) return;
    let backupIds = new Set();
    if (gapiReady) {
        try {
            const backupSales = await gapi.client.sheets.spreadsheets.values.get({ spreadsheetId: SPREADSHEET_ID, range: '產品Backup!L:L' });
            if (backupSales.result.values) backupSales.result.values.slice(1).forEach(row => { if(row[0]) backupIds.add(row[0]); });
            const backupConsume = await gapi.client.sheets.spreadsheets.values.get({ spreadsheetId: SPREADSHEET_ID, range: '客人Backup!H:H' });
            if (backupConsume.result.values) backupConsume.result.values.slice(1).forEach(row => { if(row[0]) backupIds.add(row[0]); });
        } catch(e) { console.warn("讀取備份狀態失敗", e); }
    }
    const salesRecords = records.filter(r => r.type === 'sales');
    const consumeRecords = records.filter(r => r.type === 'consumption');
    if (salesRecords.length === 0) salesContainer.innerHTML = "<div>暫無產品銷售記錄</div>";
    else {
        let html = '<table class="records-table"><thead><tr><th>日子</th><th>員工</th><th>產品</th><th>支付方式</th><th>同步狀態</th><th>備份狀態</th><th>操作</th></tr></thead><tbody>';
        for (const rec of salesRecords) {
            let statusClass = 'sync-pending', statusText = '待同步';
            if (rec.syncStatus === 'success') { statusClass = 'sync-success'; statusText = '已同步'; }
            else if (rec.syncStatus === 'failed') { statusClass = 'sync-failed'; statusText = '同步失敗'; }
            const backupStatus = backupIds.has(rec.id) ? '已備份' : '沒有對應上';
            html += `<tr>
                <td class="record-cell" title="${rec.date}">${rec.displayDate || formatDisplayDate(rec.date)}</td>
                <td>${rec.staffName}</td>
                <td>${rec.productName}</td>
                <td>${rec.payment}</td>
                <td><span class="sync-badge ${statusClass}">${statusText}</span></td>
                <td>${backupStatus}</td>
                <td class="action-btns"><button class="small-btn edit-btn" data-id="${rec.id}" data-type="edit">✏️ 修改</button><button class="small-btn danger-btn" data-id="${rec.id}" data-type="delete">🗑️ 刪除</button></td>
            </tr>`;
        }
        html += '</tbody></table>';
        salesContainer.innerHTML = html;
    }
    if (consumeRecords.length === 0) consumeContainer.innerHTML = "<div>暫無客人消費記錄</div>";
    else {
        let html = '<table class="records-table"><thead><tr><th>日子</th><th>員工</th><th>工號</th><th>金額</th><th>支付方式</th><th>同步狀態</th><th>備份狀態</th><th>操作</th></tr></thead><tbody>';
        for (const rec of consumeRecords) {
            let statusClass = 'sync-pending', statusText = '待同步';
            if (rec.syncStatus === 'success') { statusClass = 'sync-success'; statusText = '已同步'; }
            else if (rec.syncStatus === 'failed') { statusClass = 'sync-failed'; statusText = '同步失敗'; }
            const backupStatus = backupIds.has(rec.id) ? '已備份' : '沒有對應上';
            html += `<tr>
                <td class="record-cell" title="${rec.date}">${rec.displayDate || formatDisplayDate(rec.date)}</td>
                <td>${rec.staffName}</td>
                <td>${rec.staffCode || ''}</td>
                <td>${rec.amount}</td>
                <td>${rec.payment}</td>
                <td><span class="sync-badge ${statusClass}">${statusText}</span></td>
                <td>${backupStatus}</td>
                <td class="action-btns"><button class="small-btn edit-btn" data-id="${rec.id}" data-type="edit">✏️ 修改</button><button class="small-btn danger-btn" data-id="${rec.id}" data-type="delete">🗑️ 刪除</button></td>
            </tr>`;
        }
        html += '</tbody></table>';
        consumeContainer.innerHTML = html;
    }
    document.querySelectorAll('#salesRecordsTable .edit-btn, #consumeRecordsTable .edit-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
            const id = btn.dataset.id;
            const record = records.find(r => r.id === id);
            if (record) await editRecord(record);
        });
    });
    document.querySelectorAll('#salesRecordsTable .danger-btn, #consumeRecordsTable .danger-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
            const id = btn.dataset.id;
            await deleteRecordById(id);
        });
    });
}

function updateRecentRecord(type) {
    const div = document.getElementById(type === 'sales' ? 'salesRecent' : 'consumeRecent');
    const recordsOfType = records.filter(r => r.type === type).sort((a,b) => new Date(b.createdAt || b.date) - new Date(a.createdAt || a.date));
    const record = recordsOfType.length ? recordsOfType[0] : null;
    if (type === 'sales') lastSalesRecord = record;
    else lastConsumeRecord = record;
    if (!record) { if(div) div.style.display = 'none'; return; }
    div.style.display = 'flex';
    let content = '';
    if (type === 'sales') {
        content = `📅 ${record.displayDate || formatDisplayDate(record.date)} | 👤 ${record.staffName} | 📦 ${record.productName} | 💳 ${record.payment}`;
    } else {
        content = `📅 ${record.displayDate || formatDisplayDate(record.date)} | 👤 ${record.staffName} | 💰 $${record.amount} | 💳 ${record.payment}`;
    }
    div.innerHTML = `<span>${content}</span><div class="action-btns"><button class="small-btn edit-recent-btn" data-type="${type}" data-id="${record.id}">✏️ 修改</button><button class="small-btn danger-btn delete-recent-btn" data-type="${type}" data-id="${record.id}">🗑️ 刪除</button></div>`;
    const editBtn = div.querySelector('.edit-recent-btn');
    const delBtn = div.querySelector('.delete-recent-btn');
    editBtn.onclick = async () => {
        const targetRecord = records.find(r => r.id === record.id);
        if (targetRecord) showEditModal(targetRecord);
    };
    delBtn.onclick = async () => {
        await deleteRecordById(record.id, { skipPassword: true });
        updateRecentRecord(type);
    };
}
