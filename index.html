<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes, viewport-fit=cover">
    <title>Hair World系統</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --bg-body: #cfe7ff;
            --bg-card: white;
            --text-primary: #1f2937;
            --accent-orange: #f97316;
            --btn-gray-bg: #f1f5f9;
            --btn-success-bg: #22c55e;
            --stock-red: #ef4444;
            --stock-yellow: #eab308;
            --stock-green: #22c55e;
            --button-font-scale: 1.5;
            --button-text-scale: 1;
        }
        body.dark {
            --bg-body: #1f2937;
            --bg-card: #2d3748;
            --text-primary: #f3f4f6;
            --btn-gray-bg: #4b5563;
        }
        * { box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background: var(--bg-body); margin: 0; min-height: 100vh; color: var(--text-primary); }


        #loginPanel { position:fixed; top:0; left:0; width:100%; height:100%; background:var(--bg-body); display:flex; align-items:center; justify-content:center; z-index:2000; }
        .login-card { background:var(--bg-card); border-radius:48px; padding:32px 24px; text-align:center; box-shadow:0 20px 35px rgba(0,0,0,0.2); width:90%; max-width:360px; }


        .app-container { width:100%; height:100vh; display:none; flex-direction:column; padding:12px; overflow-y:auto; background:var(--bg-card); }
        .btn-group { display:flex; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
        .nav-btn { background:var(--btn-gray-bg); border:none; border-radius:32px; padding:12px 8px; font-weight:bold; box-shadow:0 5px 0 #94a3b8; }
        .nav-btn.active { background:var(--accent-orange); color:white; box-shadow:0 5px 0 #b45309; }
        .page { display:none; }
        .active { display:block; }


        .staff-group, .payment-group, .product-grid, .preset-grid { display:grid; gap:8px; grid-template-columns:repeat(3,1fr); }
        .staff-btn, .payment-btn, .preset-btn, .product-btn {
            background:var(--btn-gray-bg); border:none; border-radius:40px; padding:12px 8px; font-weight:bold; min-height:52px; box-shadow:0 3px 0 #94a3b8;
        }
        .staff-btn.active, .payment-btn.active, .preset-btn.active, .product-btn.selected {
            background:var(--accent-orange); color:white; box-shadow:0 3px 0 #b45309;
        }
        .product-name, .product-price { color: white !important; }


        .submit-btn { background:var(--btn-success-bg); color:white; width:100%; padding:14px; border:none; border-radius:40px; font-weight:bold; margin-top:10px; }
        .recent-record { background:var(--btn-gray-bg); border-radius:20px; padding:10px 12px; margin-top:10px; display:flex; justify-content:space-between; align-items:center; border-left:4px solid var(--accent-orange); }
        .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:var(--accent-orange); color:white; padding:10px 20px; border-radius:40px; z-index:10000; }
        .settings-icon-small { background:var(--accent-orange); border:none; border-radius:40px; width:44px; height:44px; color:white; }
    </style>
</head>
<body>


<div id="loginPanel">
    <div class="login-card">
        <i class="fa-solid fa-lock" style="font-size:4rem;color:var(--accent-orange);margin-bottom:16px;"></i>
        <h2>Hair World系統</h2>
        <p>請使用 Google 帳號登入以繼續</p>
        <button id="googleLoginBtn">🔐 登入 Google</button>
    </div>
</div>


<div class="app-container">
    <div class="btn-group" id="navButtons"></div>


    <!-- 產品銷售頁 -->
    <div id="salesPage" class="page">
        <div class="form-group"><label>📅 日期</label><div style="display:flex;gap:10px;"><input type="date" id="salesDate"><button class="settings-icon-small" id="settingsIconSales"><i class="fa-solid fa-gear"></i></button></div></div>
        <div class="form-group"><label>👤 員工</label><div class="staff-group" id="salesStaff"></div></div>
        <div class="form-group"><label>📦 產品</label><div id="productList" class="product-grid"></div><div style="text-align:right;font-weight:bold;">總金額: <span id="totalAmount">0</span> 元</div></div>
        <div class="form-group"><label>💳 支付方式</label><div class="payment-group" id="salesPayment"></div></div>
        <button id="submitSales" class="submit-btn">提交銷售</button>
        <div id="salesRecent" class="recent-record" style="display:none;"></div>
    </div>


    <!-- 客人消費頁 -->
    <div id="consumptionPage" class="page">
        <div class="form-group"><label>📅 日期</label><div style="display:flex;gap:10px;"><input type="date" id="consumeDate"><button class="settings-icon-small" id="settingsIconConsume"><i class="fa-solid fa-gear"></i></button></div></div>
        <div class="form-group"><label>👤 員工</label><div class="staff-group" id="consumeStaff"></div></div>
        <div class="form-group"><label>💰 金額</label><div id="presetAmounts" class="preset-grid"></div><input type="number" id="consumeAmount" placeholder="或手動輸入" step="1"></div>
        <div class="form-group"><label>💳 支付方式</label><div class="payment-group" id="consumePayment"></div></div>
        <button id="submitConsume" class="submit-btn">提交消費</button>
        <div id="consumeRecent" class="recent-record" style="display:none;"></div>
    </div>


    <!-- 庫存管理頁 -->
    <div id="inventoryPage" class="page">
        <h3>📦 庫存管理 
            <button id="toggleCostPriceBtn" class="settings-icon-small">🔒 顯示來貨價</button>
            <button class="settings-icon-small" id="settingsIconInventory"><i class="fa-solid fa-gear"></i></button>
        </h3>
        <div id="inventoryTable"></div>
        <button id="refreshInventoryBtn" class="submit-btn" style="margin-top:10px;">🔄 重新整理庫存</button>
    </div>


    <!-- 系統設定頁 -->
    <div id="settingsPage" class="page">
        <button id="backToHomeBtn" class="submit-btn" style="background:#f97316;margin-bottom:12px;">🏠 返回主頁</button>
        <h3>⚙️ 系統設定</h3><hr>


        <div style="margin:15px 0;">
            <h4>📦 資料備份與恢復</h4>
            <button id="backupBtn" class="submit-btn" style="background:#f97316;">立即備份所有資料</button>
            <div id="backupList" style="margin-top:10px;"></div>
        </div>


        <hr>
        <h4>🔐 修改管理密碼</h4>
        <input type="password" id="newPassword" placeholder="新密碼">
        <input type="password" id="confirmPassword" placeholder="確認密碼">
        <button id="changePasswordBtn">更新密碼</button>
    </div>
</div>


<script>
// ==================== Google 登入（使用你最初可正常運作的流程） ====================
const CLIENT_ID = '448045465424-kg6sd2dhp0nu8bl4afnafhpmd9f8bhj2.apps.googleusercontent.com';
const SPREADSHEET_ID = '1qqtTlgJoLdaDkNQVfzjyyEBbyvmcYB_3IQHRUnCPRMU';
const SCOPES = 'https://www.googleapis.com/auth/spreadsheets';


let tokenClient;
let gapiInited = false;
let gisInited = false;
let gapiReady = false;


let settingsPassword = 'admin123';
let records = [];
let selectedProducts = new Set();
let selectedSalesStaff = null;
let selectedConsumeStaff = null;
let selectedSalesPayment = "現金";
let selectedConsumePayment = "現金";


function gapiLoaded() { gapi.load('client', initGapiClient); }
async function initGapiClient() {
    await gapi.client.init({ discoveryDocs: ['https://sheets.googleapis.com/$discovery/rest?version=v4'] });
    gapiInited = true;
    maybeEnableButtons();
}
function gisLoaded() {
    tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: handleTokenResponse
    });
    gisInited = true;
    maybeEnableButtons();
}
function maybeEnableButtons() {
    if (gapiInited && gisInited && !gapiReady) {
        gapiReady = true;
        attemptAutoLogin();
    }
}
function attemptAutoLogin() {
    tokenClient.requestAccessToken({ prompt: '' });
}
function handleTokenResponse(resp) {
    if (resp.error) {
        alert("登入失敗：" + (resp.error_description || resp.error));
        return;
    }
    document.getElementById('loginPanel').style.display = 'none';
    document.querySelector('.app-container').style.display = 'flex';
    renderUI();
}
document.getElementById('googleLoginBtn').onclick = () => {
    tokenClient.requestAccessToken();
};


// ==================== 其他功能 ====================
function getTodayISO() { return new Date().toISOString().slice(0,10); }
function formatDisplayDate(dateStr) {
    const d = new Date(dateStr);
    return `${d.getMonth()+1}月${d.getDate()}`;
}
function showToast(msg) {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2500);
}
async function requirePassword() {
    const pwd = prompt("請輸入管理密碼");
    return pwd === settingsPassword;
}


function updateRecentRecord(type) {
    const div = document.getElementById(type === 'sales' ? 'salesRecent' : 'consumeRecent');
    const filtered = records.filter(r => r.type === type).sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
    if (filtered.length === 0) { div.style.display = 'none'; return; }


    const record = filtered[0];
    let content = type === 'sales' 
        ? `📅 ${formatDisplayDate(record.date)} | 👤 ${record.staffName} | 📦 ${record.productName || ''} | 💳 ${record.payment}`
        : `📅 ${formatDisplayDate(record.date)} | 👤 ${record.staffName} | 💰 $${record.amount} | 💳 ${record.payment}`;


    div.innerHTML = `<span>${content}</span><button class="danger-btn" data-id="${record.id}" style="padding:4px 12px;border-radius:20px;">🗑️</button>`;
    div.style.display = 'flex';


    div.querySelector('.danger-btn').onclick = async () => {
        if (await requirePassword()) {
            records = records.filter(r => r.id !== record.id);
            div.style.display = 'none';
            showToast("最後一筆已刪除");
        }
    };
}


async function submitConsumption() {
    const amount = parseInt(document.getElementById("consumeAmount").value) || 0;
    if (amount <= 0 || !selectedConsumeStaff) { alert("請輸入金額並選擇員工"); return; }


    records.unshift({
        id: 'rec-' + Date.now(),
        type: "consumption",
        date: getTodayISO(),
        staffName: selectedConsumeStaff.name,
        amount: amount,
        payment: selectedConsumePayment,
        createdAt: new Date().toISOString()
    });


    showToast(`✅ 消費 ${amount} 元 已提交`);


    // 重置金額狀態
    document.getElementById("consumeAmount").value = '';
    document.querySelectorAll("#presetAmounts .preset-btn").forEach(btn => btn.classList.remove("active"));


    updateRecentRecord('consumption');
}


async function submitSales() {
    if (!selectedSalesStaff) { alert("請選擇員工"); return; }
    const selected = Array.from(selectedProducts);
    if (selected.length === 0 && selectedSalesPayment !== "公司") { alert("請選擇產品"); return; }


    selected.forEach(name => {
        const prod = productList.find(p => p.name === name);
        if (prod) records.unshift({
            id: 'rec-' + Date.now(),
            type: "sales",
            date: getTodayISO(),
            staffName: selectedSalesStaff.name,
            productName: prod.name,
            amount: prod.price,
            payment: selectedSalesPayment,
            createdAt: new Date().toISOString()
        });
    });


    showToast(`✅ 銷售訂單已提交！共 ${selected.length} 件`);
    selectedProducts.clear();
    renderProducts();
    document.getElementById("totalAmount").innerText = "0";
    updateRecentRecord('sales');
}


function renderProducts() {
    const container = document.getElementById("productList");
    container.innerHTML = '';
    // 這裡可加入你原本的產品燈號邏輯
    productList.forEach(p => {
        const btn = document.createElement('div');
        btn.className = `product-btn ${selectedProducts.has(p.name) ? 'selected' : ''}`;
        btn.innerHTML = `<span class="product-name">${p.name}</span><span class="product-price">$${p.price}</span>`;
        btn.onclick = () => {
            if (selectedProducts.has(p.name)) selectedProducts.delete(p.name);
            else selectedProducts.add(p.name);
            renderProducts();
            calcTotal();
        };
        container.appendChild(btn);
    });
}


function calcTotal() {
    let total = 0;
    productList.forEach(p => { if (selectedProducts.has(p.name)) total += p.price; });
    document.getElementById("totalAmount").innerText = total;
}


function renderUI() {
    showPage("sales");
    showToast("登入成功！");
}


function showPage(page) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(page + "Page").classList.add('active');
}


function initNavButtons() {
    const container = document.getElementById("navButtons");
    const items = [
        {page:"consumption", icon:"fa-user-group", label:"客人消費"},
        {page:"sales", icon:"fa-cube", label:"產品銷售"},
        {page:"inventory", icon:"fa-boxes", label:"庫存管理"},
        {page:"settings", icon:"fa-gear", label:"系統設定"}
    ];
    items.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'nav-btn';
        btn.dataset.page = item.page;
        btn.innerHTML = `<i class="fa-solid ${item.icon}"></i> ${item.label}`;
        btn.onclick = () => showPage(item.page);
        container.appendChild(btn);
    });
}


// 初始化
window.addEventListener('load', () => {
    initNavButtons();


    document.getElementById("submitSales").addEventListener("click", submitSales);
    document.getElementById("submitConsume").addEventListener("click", submitConsumption);


    document.getElementById("settingsIconSales").onclick = 
    document.getElementById("settingsIconConsume").onclick = 
    document.getElementById("settingsIconInventory").onclick = () => showPage("settings");


    document.getElementById("backupBtn").onclick = () => showToast("資料備份功能已準備好（可後續擴充）");


    // 載入 Google 登入
    const s1 = document.createElement('script');
    s1.src = "https://apis.google.com/js/api.js";
    s1.onload = gapiLoaded;
    document.head.appendChild(s1);


    const s2 = document.createElement('script');
    s2.src = "https://accounts.google.com/gsi/client";
    s2.onload = gisLoaded;
    document.head.appendChild(s2);
});
</script>


<script src="https://apis.google.com/js/api.js"></script>
<script src="https://accounts.google.com/gsi/client"></script>
</body>
</html>
