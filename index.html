<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Sheets 寫入測試</title>
    <script src="https://apis.google.com/js/api.js"></script>
    <script src="https://accounts.google.com/gsi/client"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        button { padding: 10px 20px; font-size: 16px; margin: 10px; }
        #status { margin-top: 20px; padding: 10px; background: #f0f0f0; }
    </style>
</head>
<body>
<h2>Google Sheets 寫入測試</h2>
<p>請點擊「登入並授權」按鈕，同意後自動寫入一筆測試資料到您的試算表。</p>
<button id="authBtn">登入並授權</button>
<div id="status">等待操作...</div>

<script>
    const CLIENT_ID = '你的用戶端編號';  // 請替換為您的 OAuth 2.0 用戶端編號
    const SPREADSHEET_ID = '1qqtTlgJoLdaDkNQVfzjyyEBbyvmcYB_3IQHRUnCPRMU';
    const SCOPES = 'https://www.googleapis.com/auth/spreadsheets';

    let tokenClient;
    let gapiInited = false;
    let gisInited = false;

    function gapiLoaded() {
        gapi.load('client', initializeGapiClient);
    }

    async function initializeGapiClient() {
        await gapi.client.init({
            discoveryDocs: ['https://sheets.googleapis.com/$discovery/rest?version=v4'],
        });
        gapiInited = true;
        maybeEnableButtons();
    }

    function gisLoaded() {
        tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: CLIENT_ID,
            scope: SCOPES,
            callback: '', // 稍後定義
        });
        gisInited = true;
        maybeEnableButtons();
    }

    function maybeEnableButtons() {
        if (gapiInited && gisInited) {
            document.getElementById('authBtn').disabled = false;
            document.getElementById('status').innerHTML = '✅ 已準備就緒，請按上方按鈕登入授權。';
        }
    }

    async function appendTestData() {
        const range = 'Sheet1!A:J';
        const values = [[
            'test_' + Date.now(),
            'test',
            new Date().toISOString().slice(0,10),
            '1',
            'Roy',
            '100',
            '現金',
            '測試寫入',
            new Date().toISOString(),
            'pending'
        ]];
        const params = {
            spreadsheetId: SPREADSHEET_ID,
            range: range,
            valueInputOption: 'USER_ENTERED',
            resource: { values: values }
        };
        try {
            const response = await gapi.client.sheets.spreadsheets.values.append(params);
            document.getElementById('status').innerHTML = '✅ 寫入成功！請檢查試算表。' + JSON.stringify(response.result);
        } catch (err) {
            document.getElementById('status').innerHTML = '❌ 寫入失敗：' + err.message;
        }
    }

    document.getElementById('authBtn').addEventListener('click', () => {
        tokenClient.callback = async (resp) => {
            if (resp.error !== undefined) throw resp;
            document.getElementById('status').innerHTML = '✅ 已登入，正在寫入測試資料...';
            await appendTestData();
        };
        tokenClient.requestAccessToken();
    });

    // 載入 Google API
    gapiLoaded();
    gisLoaded();
</script>
</body>
</html>
